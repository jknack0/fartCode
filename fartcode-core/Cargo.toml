[package]
name = "fartcode-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fartcode-providers = { path = "../fartcode-providers" }
# The re-ask tagging convention (E19-04, #73; ADR-0038 item 7): `skills.rs`
# WRITES the tags into the seeded prompt and skill, `fartcode-telemetry`
# READS them back. One definition, in the parser, so the two halves cannot
# drift — the same doctrine `FEATURE_LOG_VERSION` applies to the rest of the
# convention. ARCHITECTURE.md §1 draws this edge (telemetry sits below
# core); the reverse edge stays closed, and `fartcode-telemetry`'s
# `tests/no_egress.rs` enforces that.
fartcode-telemetry = { path = "../fartcode-telemetry" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = "0.30"
sha2 = { workspace = true }
glob = { workspace = true }
notify = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
base64 = "0.22"
tracing = { workspace = true }
reqwest = { workspace = true }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"

[dev-dependencies]
fartcode-git = { path = "../fartcode-git" }
fartcode-providers = { path = "../fartcode-providers" }
fartcode-terminal = { path = "../fartcode-terminal" }
tempfile = "3"

# Keyring needs a platform backend enabled per-OS — with NO backend feature
# keyring v3 silently falls back to a mock store (secrets appear to work but
# vanish across calls). macOS: Keychain; other unix: secret-service over D-Bus
# (typed CredentialStore error when no service is present — see secrets.rs).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service"] }
