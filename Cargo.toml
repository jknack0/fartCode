[workspace]
resolver = "2"
members = [
    "fartcode-core",
    "fartcode-git",
    "fartcode-providers",
    "fartcode-acp",
    "fartcode-terminal",
    "fartcode-ssh",
    "fartcode-scheduler",
    "fartcode-integrations",
    "fartcode-telemetry",
    "fartcode-server",
    "fartcode-runtime",
    "fartcode-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
# ── Async runtime ──────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Serialization ──────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── ACP (Agent Client Protocol) wire types ─────────────────
agent-client-protocol-schema = "1.6"

# ── Database ───────────────────────────────────────────────
rusqlite = { version = "0.32", features = ["bundled"] }

# ── Git ────────────────────────────────────────────────────
git2 = "0.21"

# ── Terminal / PTY ─────────────────────────────────────────
portable-pty = "0.9"

# ── SSH (Phase 3, declared for fartcode-ssh) ─────────────────
russh = { version = "0.50", features = ["async-trait"] }
russh-sftp = "2.4"
ssh-key = { package = "internal-russh-forked-ssh-key", version = "=0.6.9", features = ["ed25519", "rsa", "encryption"] }

# ── Filesystem ─────────────────────────────────────────────
notify = "8"
ignore = "0.4"
glob = "0.3"

# ── Security / secrets (Phase 3, declared for later) ───────
keyring = "3"

# ── Scheduling (Phase 2, declared for fartcode-scheduler) ────
croner = "2"

# ── Observability ──────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── HTTP (Phase 2, declared for integrations/telemetry) ────
reqwest = { version = "0.12", features = ["json"] }

# ── System ─────────────────────────────────────────────────
sysinfo = "0.30"

# ── Crypto / encoding ──────────────────────────────────────
tempfile = "3"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"

# ── Errors ─────────────────────────────────────────────────
thiserror = "2"
async-trait = "0.1"

# SSH key support
ed25519-dalek = "2"
rand = "0.8"

# ── Tauri 2 ────────────────────────────────────────────────
tauri = { version = "2", features = [] }
tauri-build = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"

# ── Dev ────────────────────────────────────────────────────
[profile.release]
lto = true
codegen-units = 1
strip = true
