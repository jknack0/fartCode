[package]
name = "ade-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ade-providers = { path = "../ade-providers" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = "0.30"
sha2 = { workspace = true }
glob = { workspace = true }
notify = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
base64 = "0.22"
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"

[dev-dependencies]
ade-git = { path = "../ade-git" }
ade-providers = { path = "../ade-providers" }
ade-terminal = { path = "../ade-terminal" }
tempfile = "3"

# Keyring needs a platform backend enabled per-OS — with NO backend feature
# keyring v3 silently falls back to a mock store (secrets appear to work but
# vanish across calls). macOS: Keychain; other unix: secret-service over D-Bus
# (typed CredentialStore error when no service is present — see secrets.rs).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service"] }
